services:
  - type: web
    name: tai-oposiciones
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2
      - key: ADMIN_EMAILS
        value: antronqui1@gmail.com,antronqui@gmail.com
      - key: SITE_NAME
        value: TAI 2027
      - key: SITE_DOMAIN
        value: tai-oposiciones.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Postgres (Neon / Supabase / Render). Sin esto se usa SQLite, que en el
      # plan free de Render se restaura en cada despliegue.
      - key: DATABASE_URL
        sync: false
      # Brevo SMTP en el puerto 2525 (Render free bloquea 25/465/587)
      - key: EMAIL_HOST
        value: smtp-relay.brevo.com
      - key: EMAIL_PORT
        value: "2525"
      - key: EMAIL_USE_TLS
        value: "True"
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: "TAI 2027 <antronqui1@gmail.com>"
