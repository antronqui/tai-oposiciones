{% extends "base.html" %}

{% block title %}Contraseña actualizada - TAI 2027{% endblock %}

        <div class="card card-custom p-4 p-md-5 bg-white shadow-sm text-center">
            <div class="mb-3">
                <span class="d-inline-flex align-items-center justify-content-center bg-success-subtle text-success rounded-circle p-3" style="width: 76px; height: 76px;">

            </a>
        </div>
    </div>
</div>
{% endblock %}
