{% extends "base.html" %}

{% block title %}Correo enviado - TAI 2027{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-9 col-lg-6">
        <div class="card card-custom p-4 p-md-5 bg-white shadow-sm text-center">
            <div class="mb-3">
                <span class="d-inline-flex align-items-center justify-content-center bg-primary-subtle text-primary rounded-circle p-3" style="width: 76px; height: 76px;">
                    <i class="bi bi-send-check fs-1"></i>
                </span>
            </div>
            <h3 class="fw-bold mb-2">Correo enviado</h3>
            <p class="text-muted mb-4">
                Si esa dirección está registrada, recibirás un mensaje con las instrucciones
                para cambiar tu contraseña. Revisa también la carpeta de spam.
            </p>
            <a href="{% url 'account_login' %}" class="btn btn-primary btn-tai py-2">
                <i class="bi bi-box-arrow-in-right me-2"></i> Volver al acceso
            </a>
        </div>
    </div>
</div>
{% endblock %}
