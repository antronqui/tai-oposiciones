{% extends "base.html" %}

{% block title %}Configurar Sesión Adaptativa - TAI 2027{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-lg-8">
        <div class="card card-custom p-4 p-md-5 bg-white shadow-sm">
            <div class="text-center mb-4">
                <span class="badge bg-warning-subtle text-warning border border-warning-subtle px-3 py-2 rounded-pill fw-bold mb-2">
                    <i class="bi bi-clock-history me-1"></i> Sesión Inteligente
                </span>
                <h3 class="fw-bold text-dark">¿Cuánto tiempo tienes para estudiar hoy?</h3>
                <p class="text-muted small">
                    El algoritmo optimizará la proporción de tarjetas de memoria (SRS) y preguntas tipo test del INAP.
                </p>
            </div>

            <form action="{% url 'estudio:iniciar_sesion' %}" method="get">
                <!-- Duración -->
                <div class="mb-4">
                    <label class="form-label fw-bold text-dark mb-3">1. Selecciona la duración:</label>
                    <div class="row g-3 text-center">
                        <div class="col-6 col-md-3">
                            <input type="radio" class="btn-check" name="duracion" id="dur15" value="15" checked>
                            <label class="btn btn-outline-primary p-3 w-100 rounded-3 h-100 d-flex flex-column justify-content-center" for="dur15">
                                <div class="fs-3 fw-bold">15 min</div>
                                <small class="text-muted">10m + 5m test</small>
                            </label>
                        </div>
                        <div class="col-6 col-md-3">
                            <input type="radio" class="btn-check" name="duracion" id="dur30" value="30">
                            <label class="btn btn-outline-primary p-3 w-100 rounded-3 h-100 d-flex flex-column justify-content-center" for="dur30">
                                <div class="fs-3 fw-bold">30 min</div>
                                <small class="text-muted">20m + 10m test</small>
                            </label>
                        </div>
                        <div class="col-6 col-md-3">
                            <input type="radio" class="btn-check" name="duracion" id="dur45" value="45">
                            <label class="btn btn-outline-primary p-3 w-100 rounded-3 h-100 d-flex flex-column justify-content-center" for="dur45">
                                <div class="fs-3 fw-bold">45 min</div>
                                <small class="text-muted">30m + 15m test</small>
                            </label>
                        </div>
                        <div class="col-6 col-md-3">
                            <input type="radio" class="btn-check" name="duracion" id="dur60" value="60">
                            <label class="btn btn-outline-primary p-3 w-100 rounded-3 h-100 d-flex flex-column justify-content-center" for="dur60">
                                <div class="fs-3 fw-bold">60 min</div>
                                <small class="text-muted">40m + 20m test</small>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Bloque temático -->
                <div class="mb-4">
                    <label class="form-label fw-bold text-dark mb-2">2. Filtrar por Bloque Oficial (Opcional):</label>
                    <select name="bloque" class="form-select">
                        <option value="">Todos los Bloques (Recomendado - Estudio Integral)</option>
                        {% for b in bloques %}
                        <option value="{{ b.id }}">Bloque {{ b.numero }}: {{ b.nombre }}</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Modo de Estudio -->
                <div class="mb-4">
                    <label class="form-label fw-bold text-dark mb-2">3. Modo de Estudio:</label>
                    <div class="d-flex flex-wrap gap-2">
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="modo" id="modoMixto" value="mixto" checked>
                            <label class="form-check-label" for="modoMixto">Mixto (Tarjetas SRS + Test)</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="modo" id="modoCards" value="flashcards">
                            <label class="form-check-label" for="modoCards">Sólo Flashcards</label>
                        </div>
                        <div class="form-check form-check-inline">
                            <input class="form-check-input" type="radio" name="modo" id="modoTest" value="test">
                            <label class="form-check-label" for="modoTest">Sólo Simulacro Test INAP</label>
                        </div>
                    </div>
                </div>

                <div class="d-grid mt-4">
                    <button type="submit" class="btn btn-primary btn-tai btn-lg">
                        <i class="bi bi-play-circle-fill me-2"></i> Comenzar Sesión de Estudio
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
